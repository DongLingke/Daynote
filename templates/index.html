<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>我的待办</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- SVG filter definitions for liquid glass and frosted effects -->
  <svg id="svg-defs" xmlns="http://www.w3.org/2000/svg"
       style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="liquid-distort" x="-8%" y="-8%" width="116%" height="116%"
              color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.016 0.014"
                      numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"
                           xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="frosted-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4"
                      stitchTiles="stitch" result="noise"/>
        <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
        <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="b"/>
        <feComposite in="b" in2="SourceGraphic" operator="in"/>
      </filter>
    </defs>
  </svg>

  <div id="app">
    <div id="wallpaper"></div>
    <main id="card-wrapper"></main>
  </div>

  <div id="edit-modal" class="hidden">
    <div class="modal-overlay" data-act="close-modal"></div>
    <div class="modal-card"></div>
  </div>

  <script src="/static/js/vendor/marked.min.js"></script>
  <script src="/static/js/vendor/dompurify.min.js"></script>
  <script src="/static/js/vendor/lunar.js"></script>
  <script src="/static/js/vendor/tiptap.bundle.js"></script>
  <script src="/static/js/vendor/emoji-data.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
